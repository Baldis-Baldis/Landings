<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Přistání">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kde jsem přistál · Where I've landed</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F6F2;--ink:#1B2740;--ink2:#5B657A;--line:#D5D9D0;--icao:#C4177C;--slz:#2C64B5;--custom:#8A5A2B;--done:#1E7B4B;--done-bg:#E3F2E8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
header h1{font:700 21px/1 "Barlow Condensed",sans-serif;margin:0;flex:1}
header .count{font:700 28px/1 "Barlow Condensed",sans-serif;color:var(--done);white-space:nowrap}
header .count small{font:500 12px/1 Barlow,sans-serif;color:var(--ink2);margin-left:4px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{font:600 12px Barlow,sans-serif;padding:6px 9px;border:0;background:#fff;color:var(--ink2);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
#map{height:46dvh;min-height:220px;flex:0 0 auto}
.side{display:flex;flex-direction:column;flex:1;min-height:0}
.tools{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff}
.tools input[type=search]{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font:500 15px Barlow,sans-serif;background:var(--paper)}
.tools select{padding:0 8px;border:1px solid var(--line);border-radius:6px;font:500 14px Barlow,sans-serif;background:var(--paper);color:var(--ink);max-width:40%}
#list{flex:1;overflow:auto;background:#fff}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row.done{background:var(--done-bg)}
.row input{width:22px;height:22px;accent-color:var(--done);margin:0}
.row .name{font-weight:600;font-size:15px}
.row .meta{font-size:12.5px;color:var(--ink2)}
.row .code{font:600 12px Barlow,sans-serif;padding:2px 6px;border-radius:4px;color:#fff;background:var(--slz)}
.row .code.icao{background:var(--icao)}
.row .date{font-size:12.5px;color:var(--done);font-weight:600;text-align:right}
.legend{display:flex;gap:14px;padding:6px 14px;font-size:12px;color:var(--ink2);background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.addbtn{font:600 20px/1 Barlow,sans-serif;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;flex:0 0 auto}
.addbtn.on{background:var(--custom);color:#fff;border-color:var(--custom)}
#map.addmode{cursor:crosshair}
.pop .del{background:none;border:0;color:#B3261E;font:600 12px Barlow,sans-serif;padding:0;margin-top:4px;cursor:pointer}
.row .code.custom{background:var(--custom)}
.pop{font-family:Barlow,sans-serif;min-width:200px}
.pop b{font-size:15px}
.pop .m{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.pop label{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.pop input[type=date],.pop input[type=text]{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px;font:14px Barlow,sans-serif;margin-bottom:6px}
.leaflet-popup-content{margin:12px 14px}
footer{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12.5px;background:var(--paper)}
footer button{font:600 12.5px Barlow,sans-serif;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
footer .status{margin-left:auto;color:var(--ink2);align-self:center}
@media (min-width:900px){#app{flex-direction:row;flex-wrap:wrap}header{width:100%}#map{height:auto;flex:1 1 55%}.side{flex:1 1 45%;max-width:520px;height:calc(100dvh - 55px)}}
</style>
</head>
<body>
<div id="app">
<header><h1 data-i data-t="title"></h1><div class="count"><span id="cnt">0</span><small><span data-i data-t="of"></span> <span id="tot">0</span></small></div>
<div class="lang"><button data-l="cs">CZ</button><button data-l="en">EN</button></div></header>
<div id="map"></div>
<div class="side">
<div class="tools">
<input id="q" type="search">

<button id="addbtn" class="addbtn" title="">+</button>
</div>
<div class="legend"><span><i style="background:var(--icao)"></i><span data-i data-t="icao"></span></span><span><i style="background:var(--slz)"></i><span data-i data-t="slz"></span></span><span><i style="background:var(--custom)"></i><span data-i data-t="custom"></span></span><span><i style="background:var(--done)"></i><span data-i data-t="landed"></span></span></div>
<p id="addhint" style="display:none;margin:0;padding:6px 14px;font-size:12.5px;background:#FFF3E0;color:var(--ink)" data-i data-t="addHint"></p>
<div id="list"></div>
<footer><button id="exp" data-i data-t="export"></button><button id="imp" data-i data-t="import"></button><input id="file" type="file" accept=".json" hidden><span class="status" id="st"></span><span style="width:100%;font-size:11px;color:var(--ink2)" data-i data-t="src"></span></footer>
</div>
</div>

const T={
 cs:{title:'Kde jsem přistál',of:'z',all:'Vše',icaoOnly:'Jen ICAO letiště',slzOnly:'Jen SLZ plochy',customOnly:'Jen vlastní plochy',doneOnly:'Přistál jsem',todoOnly:'Ještě ne',icao:'ICAO letiště',slz:'SLZ / UL plocha',custom:'Vlastní / neveřejná',landed:'Přistál jsem',export:'Export zálohy',import:'Import',search:'Hledat název nebo kód (LKPR, Kunovice…)',here:'Přistál jsem tady',note:'Poznámka',saved:'Uloženo',imported:'Import hotov',bad:'Neplatný soubor',addTitle:'Přidat vlastní plochu',addHint:'Klepnutím na mapu umísti novou plochu.',addName:'Název plochy:',addNoName:'Přidání zrušeno – chybí název.',del:'Smazat plochu',delConfirm:'Opravdu smazat tuto vlastní plochu?',dateFmt:d=>{const[y,m,x]=d.split('-');return`${+x}. ${+m}. ${y}`},src:'Zdroj: VFR příručka ŘLP ČR, platnost od 3. 9. 2026 · souřadnice OurAirports · vlastní plochy si přidáváš sám'},
 en:{title:"Where I've landed",of:'of',all:'All',icaoOnly:'ICAO airports only',slzOnly:'UL airstrips only',customOnly:'Custom strips only',doneOnly:'Landed',todoOnly:'Not yet',icao:'ICAO airport',slz:'UL / microlight strip',custom:'Custom / private',landed:'Landed',export:'Export backup',import:'Import',search:'Search name or code (LKPR, Kunovice…)',here:'I landed here',note:'Note',saved:'Saved',imported:'Import done',bad:'Invalid file',addTitle:'Add a custom strip',addHint:'Tap the map to place the new strip.',addName:'Strip name:',addNoName:'Cancelled – no name given.',del:'Delete strip',delConfirm:'Delete this custom strip?',dateFmt:d=>{const[y,m,x]=d.split('-');return`${y}-${m}-${x}`},src:'Source: Czech VFR Manual (ANS CR), effective 3 Sep 2026 · coordinates OurAirports · custom strips are your own additions'}
};
let lang=localStorage.getItem('lang')||(navigator.language.startsWith('cs')?'cs':'en');
const t=k=>T[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.t));
  document.getElementById('q').placeholder=t('search');
  document.getElementById('addbtn').title=t('addTitle');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  render();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem('lang',lang);applyLang();if(map)map.closePopup();});

const KEY='visited-cz-airfields';
const CKEY='custom-airfields';
let visited={};
try{visited=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let custom={};
try{custom=JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){}
function kind(a){ return a.custom?'custom':(a.slz?'slz':'icao'); }
function allData(){ return DATA.concat(Object.values(custom)); }
function refreshTotal(){ document.getElementById('tot').textContent=allData().length; }
refreshTotal();
function save(){ localStorage.setItem(KEY,JSON.stringify(visited)); status(t('saved')); }
function saveCustom(){ localStorage.setItem(CKEY,JSON.stringify(custom)); }
function status(x){const s=document.getElementById('st');s.textContent=x;setTimeout(()=>{if(s.textContent===x)s.textContent=''},2500)}

let map=null; const markers={};
try{
  map=L.map('map').setView([49.8,15.5],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap · letiště: VFR příručka ŘLP ČR (WEF 03 SEP 26)'}).addTo(map);
  allData().forEach(addMarker);
  map.on('click',e=>{ if(addMode) placeCustom(e.latlng.lat,e.latlng.lng); });
}catch(e){ document.getElementById('map').innerHTML='<p style="padding:16px;color:#5B657A">Mapu se nepodařilo načíst / Map failed to load.</p>'; }
function addMarker(a){
  const m=L.circleMarker([a.lat,a.lon],{radius:kind(a)==='icao'?7:5,weight:2}).addTo(map);
  m.bindPopup(()=>popup(a)); markers[a.code]=m; style(a);
}
function style(a){
  if(!markers[a.code]) return;
  const v=visited[a.code], colors={icao:'#C4177C',slz:'#2C64B5',custom:'#8A5A2B'};
  markers[a.code].setStyle(v?{color:'#1E7B4B',fillColor:'#1E7B4B',fillOpacity:1}:{color:colors[kind(a)],fillColor:'#fff',fillOpacity:.9});
}
const today=()=>new Date().toISOString().slice(0,10);
function popup(a){
  const v=visited[a.code]||{};
  const d=document.createElement('div');d.className='pop';
  d.innerHTML=`<b>${a.name}</b><div class="m">${a.code}${a.town?' · '+a.town:''}${a.elev?' · '+a.elev+' ft':''}</div>
  <label><input type="checkbox" ${v.date!==undefined?'checked':''}> ${t('here')}</label>
  <input type="date" value="${v.date||''}"><input type="text" placeholder="${t('note')}" value="${v.note||''}">`;
  const [cb,dt,nt]=d.querySelectorAll('input');
  cb.onchange=()=>{ if(cb.checked){ if(!dt.value) dt.value=today(); set(a,{date:dt.value,note:nt.value}); } else set(a,null); };
  dt.onchange=nt.onchange=()=>{ if(cb.checked) set(a,{date:dt.value,note:nt.value}); };
  if(a.custom){
    const del=document.createElement('button'); del.className='del'; del.textContent=t('del');
    del.onclick=()=>{ if(confirm(t('delConfirm'))) deleteCustom(a); };
    d.appendChild(del);
  }
  return d;
}
function set(a,val){ if(val) visited[a.code]=val; else delete visited[a.code]; style(a); render(); save(); }

let addMode=false;
const addBtn=document.getElementById('addbtn'), addHint=document.getElementById('addhint');
addBtn.onclick=()=>{
  addMode=!addMode;
  addBtn.classList.toggle('on',addMode);
  addHint.style.display=addMode?'block':'none';
  document.getElementById('map').classList.toggle('addmode',addMode);
};
function placeCustom(lat,lon){
  const name=prompt(t('addName'));
  if(!name||!name.trim()){ status(t('addNoName')); return; }
  const code='C'+Date.now().toString(36).toUpperCase();
  const a={code,name:name.trim(),lat:Math.round(lat*100000)/100000,lon:Math.round(lon*100000)/100000,elev:'',town:'',custom:true};
  custom[code]=a; saveCustom(); refreshTotal();
  if(map){ addMarker(a); map.setView([lat,lon],13); markers[code].openPopup(); }
  addMode=false; addBtn.classList.remove('on'); addHint.style.display='none';
  document.getElementById('map').classList.remove('addmode');
  render();
}
function deleteCustom(a){
  delete custom[a.code]; saveCustom();
  delete visited[a.code]; save();
  if(map&&markers[a.code]){ map.removeLayer(markers[a.code]); delete markers[a.code]; }
  refreshTotal(); render();
}

const list=document.getElementById('list'), q=document.getElementById('q'), f=document.getElementById('f');
q.oninput=render; f.onchange=render;
function render(){
  document.getElementById('cnt').textContent=Object.keys(visited).length;
  const s=q.value.trim().toLowerCase(), mode=f.value;
  list.innerHTML='';
  allData().filter(a=>{
    if(s&&!(a.name.toLowerCase().includes(s)||a.code.toLowerCase().includes(s)||(a.town||'').toLowerCase().includes(s))) return false;
    const k=kind(a);
    if(mode==='icao')return k==='icao'; if(mode==='slz')return k==='slz'; if(mode==='custom')return k==='custom';
    if(mode==='done')return !!visited[a.code]; if(mode==='todo')return !visited[a.code]; return true;
  }).forEach(a=>{
    const v=visited[a.code], k=kind(a);
    const r=document.createElement('div');r.className='row'+(v?' done':'');
    r.innerHTML=`<input type="checkbox" ${v?'checked':''}><div><div class="name">${a.name}</div><div class="meta"><span class="code ${k}">${a.code}</span> ${a.town||''}</div></div><div class="date">${v&&v.date?t('dateFmt')(v.date):''}</div>`;
    const cb=r.querySelector('input');
    cb.onclick=e=>{e.stopPropagation(); cb.checked?set(a,{date:today(),note:''}):set(a,null);};
    r.onclick=()=>{ if(map){ map.setView([a.lat,a.lon],12); markers[a.code].openPopup(); } };
    list.appendChild(r);
  });
}
document.getElementById('exp').onclick=()=>{
  const b=new Blob([JSON.stringify({visited,custom},null,1)],{type:'application/json'});
  const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='landings-cz.json';x.click();
};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{
  try{
    const data=JSON.parse(await e.target.files[0].text());
    if(data.visited||data.custom){
      Object.assign(visited,data.visited||{}); Object.assign(custom,data.custom||{});
    } else { Object.assign(visited,data); }
    saveCustom(); refreshTotal();
    if(map){ Object.values(custom).forEach(a=>{ if(!markers[a.code]) addMarker(a); }); allData().forEach(style); }
    render(); save(); status(t('imported'));
  }catch(err){ status(t('bad')); }
};
applyLang();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
